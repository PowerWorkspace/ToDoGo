name: Sync Gitee to GitHub

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITEE_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat > ~/.ssh/config << EOF
          Host gitee.com
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Mirror Gitee repo to GitHub
        run: |
          git config --global user.email "sync-bot@users.noreply.github.com"
          git config --global user.name "Sync Bot"
          git clone --bare git@gitee.com:powerclub/to-do-go.git gitee-mirror
          cd gitee-mirror
          git push --mirror https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git
