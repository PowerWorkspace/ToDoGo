name: Sync Gitee to GitHub

on:
  workflow_dispatch: # 支持手动点击触发
  schedule:
    # UTC 每月1日、16日 0点（北京时间上午8点）执行
    - cron: '0 0 1,16 * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITEE_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat > ~/.ssh/config << EOF
          Host gitee.com
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Mirror Gitee repo to GitHub
        run: |
          git config --global user.email "sync-bot@users.noreply.github.com"
          git config --global user.name "Sync Bot"
          git clone --bare git@gitee.com:powerclub/to-do-go.git gitee-mirror
          cd gitee-mirror
          # 推送master分支
          git push https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git master
          # 推送所有标签
          git push https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git --tags
